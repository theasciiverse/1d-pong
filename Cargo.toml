[package]
name = "one-d-pong"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "1D-Pong: Pong with one dimension, for the terminal"

[[bin]]
name = "1d-pong"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
